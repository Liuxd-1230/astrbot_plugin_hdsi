<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDS Interlude</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--border:#e2e6ea;--text:#1a1a2e;--sub:#666;--accent:#4f6ef7;--ok:#22a55f;--warn:#d4940;--err:#d32f2f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}

/* ---- header ---- */
.header{margin-bottom:20px}
.header h1{margin:0;font-size:20px;font-weight:600}
.header .desc{color:var(--sub);font-size:13px;margin-top:2px}

/* ---- status banner ---- */
.banner{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.banner .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.banner .dot.on{background:var(--ok)}
.banner .dot.off{background:var(--err)}
.banner .dot.warn{background:var(--warn)}
.banner .label{font-weight:500}
.banner .detail{color:var(--sub);font-size:13px}

/* ---- steps ---- */
.steps{margin-bottom:24px}
.step{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0;margin-top:2px}
.step.done .num{background:var(--ok)}
.step h3{margin:0 0 4px;font-size:15px;font-weight:600}
.step p{margin:0;color:var(--sub);font-size:13px}
.step code{background:#eef1f5;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13px;color:var(--accent)}
.step .status-tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;margin-left:8px}
.step .status-tag.ok{background:#e6f7ee;color:var(--ok)}
.step .status-tag.todo{background:#fff3e0;color:#b8860b}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.card h2 .icon{font-size:16px}

/* ---- quick actions ---- */
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:13px;background:var(--card);transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--err);border-color:#f5c6c6}
.btn.danger:hover{background:#fef2f2}

/* ---- info rows ---- */
.info-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.info-row:last-child{border:none}
.info-row .k{color:var(--sub);min-width:90px}
.info-row .v{word-break:break-all}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--border);overflow-x:auto;padding-bottom:0}
.tab{padding:8px 14px;border:none;background:none;cursor:pointer;color:var(--sub);font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.tab:hover{color:var(--text)}

/* ---- form ---- */
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.field input,.field textarea,.field select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fafbfc}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}

/* ---- toast ---- */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 22px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- collapsible ---- */
details summary{cursor:pointer;font-size:13px;color:var(--sub);padding:6px 0;user-select:none}
details summary:hover{color:var(--accent)}
.mono{font-family:ui-monospace,"SF Mono",monospace;font-size:12px}
.muted{color:var(--sub);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>幕间 · HDS Interlude</h1>
    <div class="desc">角色拥有自己的生活，回复、沉默、延迟都是剧情的一部分</div>
  </div>

  <!-- status -->
  <div class="banner" id="banner">
    <div class="dot off" id="status-dot"></div>
    <div>
      <div class="label" id="status-label">正在检查状态…</div>
      <div class="detail" id="status-detail"></div>
    </div>
  </div>

  <!-- quick start steps (shown when not fully set up) -->
  <div class="steps" id="steps">
    <div class="step" id="step-provider">
      <div class="num">✓</div>
      <div><h3>配置模型</h3><p>在 AstrBot → 服务提供商 页面添加一个 LLM（如 OpenAI / DeepSeek 等），并设为默认。</p></div>
    </div>
    <div class="step" id="step-init">
      <div class="num">1</div>
      <div>
        <h3>创建角色剧本 <span class="status-tag todo" id="tag-init">待完成</span></h3>
        <p>在聊天窗口发送 <code>hdsi init 角色名</code>，例如 <code>hdsi init 小明</code>。只需执行一次。</p>
      </div>
    </div>
    <div class="step" id="step-chat">
      <div class="num">2</div>
      <div>
        <h3>开始聊天 <span class="status-tag todo" id="tag-chat">待完成</span></h3>
        <p>直接发送普通消息即可。角色可能立即回复、沉默或稍后回复——这些都是剧情的一部分。</p>
      </div>
    </div>
  </div>

  <!-- tabs for management -->
  <div class="tabs">
    <button class="tab active" data-tab="status">当前状态</button>
    <button class="tab" data-tab="canon">角色设定</button>
    <button class="tab" data-tab="memory">记忆与事实</button>
    <button class="tab" data-tab="script">剧情记录</button>
    <button class="tab" data-tab="advanced">高级设置</button>
  </div>

  <div id="view"><div class="muted">加载中…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const PLUGIN = "astrbot_plugin_hdsi";

function normalizeEndpoint(e) { return String(e || "").replace(/^\/+/, ""); }

async function apiGet(endpoint, params = {}) {
  const path = normalizeEndpoint(endpoint);
  if (window.AstrBotPluginPage?.apiGet) return await window.AstrBotPluginPage.apiGet(path, params);
  const q = new URLSearchParams(params).toString();
  const res = await fetch(`/api/v1/plugins/extensions/${PLUGIN}/${path}` + (q ? `?${q}` : ""), { credentials: "include" });
  const d = await res.json();
  if (!res.ok || d?.status === "error") throw new Error(d?.message || `HTTP ${res.status}`);
  return d?.data !== undefined ? d.data : d;
}

async function apiPost(endpoint, body = {}) {
  const path = normalizeEndpoint(endpoint);
  if (window.AstrBotPluginPage?.apiPost) return await window.AstrBotPluginPage.apiPost(path, body);
  const res = await fetch(`/api/v1/plugins/extensions/${PLUGIN}/${path}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    credentials: "include", body: JSON.stringify(body),
  });
  const d = await res.json();
  if (!res.ok || d?.status === "error") throw new Error(d?.message || `HTTP ${res.status}`);
  return d?.data !== undefined ? d.data : d;
}

function esc(v) { return v == null ? "" : String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function fmtTime(t) { if (!t) return "-"; try { return String(t).replace("T", " ").slice(0, 19); } catch { return t; } }
function toast(msg, err) { const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 3000); }

let CFG = null;
async function getConfig() {
  if (!CFG) CFG = await apiGet("hdsi/config");
  return CFG;
}

// ---- tab switching ----
document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    renderView(tab.dataset.tab);
  };
});

async function renderView(tab) {
  const view = document.getElementById("view");
  view.innerHTML = '<div class="muted">加载中…</div>';
  try {
    if (tab === "status") await renderStatus(view);
    else if (tab === "canon") await renderCanon(view);
    else if (tab === "memory") await renderMemory(view);
    else if (tab === "script") await renderScript(view);
    else if (tab === "advanced") await renderAdvanced(view);
  } catch (e) { view.innerHTML = `<div class="card"><p style="color:var(--err)">${esc(e.message)}</p></div>`; }
}

// ---- status tab ----
async function renderStatus(view) {
  const data = await apiGet("hdsi/overview");
  if (!data?.story) { view.innerHTML = '<div class="card"><p>还没有故事。请在聊天中发送 <code>hdsi init 角色名</code> 创建。</p></div>'; return; }
  const s = data.story;
  view.innerHTML = `<div class="card"><h2>📖 当前故事</h2>${[
    ["主角", s.characterName], ["状态", s.status], ["参与者", s.participants + " 人"],
    ["写到", fmtTime(s.cursorAt)], ["下次自动推进", fmtTime(s.automation?.nextAdvanceAt)],
    ["主动联系", s.allowProactive ? "开启" : "关闭"],
  ].map(([k, v]) => `<div class="info-row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>

  <div class="card"><h2>⏳ 等待中的计划</h2>${table(["类型", "时间", "内容"], (data.pendingIntents || []).map(i => [i.type, fmtTime(i.notBefore), i.summary]))}</div>

  <div class="card"><h2>📜 最近剧情</h2>${table(["时间", "内容"], (data.recentScript || []).slice(-6).map(e => [fmtTime(e.occurredAt), e.content]))}</div>`;
}

// ---- canon tab ----
async function renderCanon(view) {
  await getConfig();
  const d = CFG.story_defaults;
  view.innerHTML = `<div class="card"><h2>🎭 角色设定（Canon）</h2>
    <p class="muted">这是角色的起点设定。修改后建议在"高级设置"中清理对应 overlay。</p>
    ${fld("story_defaults.character_name","角色名",d.character_name)}
    ${fld("story_defaults.timezone","时区",d.timezone)}
    ${ta("story_defaults.character_profile","角色背景（性格/日程/说话方式）",d.character_profile)}
    ${ta("story_defaults.world","世界设定",d.world)}
    ${ta("story_defaults.relationship","默认初始关系",d.relationship)}
    <button class="btn primary" onclick="saveConfigFromForms()">保存设定</button>
  </div>
  <div class="card"><h2>✍️ 写作风格</h2>
    ${ta("prompts.main_prompt","叙事指令",CFG.prompts.main_prompt)}
    ${ta("prompts.style_prompt","文风",CFG.prompts.style_prompt)}
    <button class="btn primary" onclick="saveConfigFromForms()">保存风格</button>
  </div>`;
}

function fld(path, label, value) {
  return `<div class="field"><label>${esc(label)}</label><input type="text" data-path="${esc(path)}" value="${esc(value)}"></div>`;
}
function ta(path, label, value) {
  return `<div class="field"><label>${esc(label)}</label><textarea data-path="${esc(path)}">${esc(value)}</textarea></div>`;
}

async function saveConfigFromForms() {
  const patch = collectFormValues(document.getElementById("view"));
  await apiPost("hdsi/config", patch);
  CFG = null;
  toast("已保存 ✓");
}

function coerceScalarList(text) {
  return String(text).split("\n").map(s => s.trim()).filter(Boolean)
    .map(s => /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : s);
}
function reconcile(patch, original) {
  if (Array.isArray(original)) {
    if (original.every(v => typeof v !== "object" || v === null)) {
      if (typeof patch === "string") return coerceScalarList(patch);
      return Array.isArray(patch) ? patch : original;
    }
    if (patch && typeof patch === "object" && !Array.isArray(patch)) {
      return Object.keys(patch).filter(k => /^\d+$/.test(k)).sort((a, b) => a - b)
        .map((k, i) => reconcile(patch[k] || {}, original[i] || {}));
    }
    return Array.isArray(patch) ? patch : original;
  }
  if (original && typeof original === "object") {
    if (!patch || typeof patch !== "object" || Array.isArray(patch)) return original;
    const out = {};
    for (const key of Object.keys(original)) {
      out[key] = key in patch ? reconcile(patch[key], original[key]) : original[key];
    }
    return out;
  }
  return patch;
}
function collectFormValues(root) {
  const raw = {};
  root.querySelectorAll("[data-path]").forEach(el => {
    const parts = el.dataset.path.split(".");
    let node = raw;
    while (parts.length > 1) { node[parts[0]] = node[parts[0]] || {}; node = node[parts.shift()]; }
    raw[parts[0]] = el.type === "number" ? Number(el.value) : el.value;
  });
  return reconcile(raw, CFG);
}

// ---- memory tab ----
async function renderMemory(view) {
  const intents = await apiGet("hdsi/intents").catch(() => []);
  view.innerHTML = `<div class="card"><h2>🧠 记忆与计划</h2>
    <p class="muted">角色会记住重要的对话，并在之后的剧情中自然提起。</p>
    ${table(["类型", "时间", "摘要"], (intents || []).map(i => [i.type, fmtTime(i.not_before), String(i.summary).slice(0, 80)]))}
  </div>`;
}

// ---- script tab ----
let scriptOffset = 0;
async function renderScript(view) {
  const rows = await apiGet("hdsi/script", { limit: 30, offset: scriptOffset });
  view.innerHTML = `<div class="card"><h2>📜 剧情记录（真实事件日志）</h2>
    <div style="margin-bottom:10px">
      <button class="btn" onclick="scriptOffset=Math.max(0,scriptOffset-30);renderCurrent()">← 上一页</button>
      <button class="btn" onclick="scriptOffset+=30;renderCurrent()">下一页 →</button>
    </div>
    ${table(["时间", "谁", "内容"],
      (rows || []).reverse().map(e => [fmtTime(e.occurred_at),
        e.kind === "character-message" ? "角色" : e.kind === "user-message" ? "用户" : e.actor,
        e.content]))}
  </div>`;
}
function renderCurrent() { renderView(document.querySelector(".tab.active").dataset.tab); }

// ---- advanced tab ----
async function renderAdvanced(view) {
  await getConfig();
  view.innerHTML = `
  <div class="card"><h2>⚙️ 运行参数</h2>
    <p class="muted">以下参数通常保持默认即可。</p>
    ${fld("runtime.auto_advance_interval_minutes","自动推进间隔（分钟）",CFG.runtime.auto_advance_interval_minutes)}
    ${fld("runtime.user_message_debounce_seconds","消息合并等待（秒）",CFG.runtime.user_message_debounce_seconds)}
    ${sel("runtime.allow_proactive_messages","允许主动联系",CFG.runtime.allow_proactive_messages)}
    <button class="btn primary" onclick="saveConfigFromForms()">保存</button>
  </div>
  <div class="card"><h2>🔧 维护操作</h2>
    <div class="actions">
      <button class="btn" onclick="maint('advance')">手动推进剧情</button>
      <button class="btn" onclick="maint('compact')">整理记忆</button>
      <button class="btn" onclick="maint('rebuild_continuity')">重建连续性</button>
    </div>
  </div>
  <div class="card"><h2>⚠️ 危险操作</h2>
    <p class="muted">以下操作不可逆，请确认后再点击。</p>
    <div class="actions">
      <button class="btn danger" onclick="clearOverlay('all')">清除全部演化</button>
      <button class="btn danger" onclick="resetStory()">重置全部数据</button>
    </div>
  </div>
  <div class="card"><h2>📥 从 Koishi 版迁移</h2>
    <p class="muted">粘贴原 HDS-Interlude 的 JSON 配置即可自动映射。</p>
    <div class="field"><textarea id="koishi-json" placeholder='{"storyDefaults": {...}}' style="min-height:100px"></textarea></div>
    <button class="btn" onclick="importKoishi()">导入配置</button>
  </div>`;
}

function sel(path, label, value) {
  return `<div class="field"><label>${esc(label)}</label><select data-path="${esc(path)}">
    <option value="true"${value ? " selected" : ""}>开启</option>
    <option value="false"${!value ? " selected" : ""}>关闭</option></select></div>`;
}

async function clearOverlay(target) {
  if (!confirm(`确认清除 ${target} overlay？剧本和记忆不会删除。`)) return;
  if (!confirm("再次确认？")) return;
  const r = await apiPost("hdsi/maintenance", { action: "clear_overlay", arg: target });
  toast(r.message || "完成"); renderCurrent();
}

async function resetStory() {
  if (!confirm("确认重置全部剧本、记忆与角色？此操作不可逆！")) return;
  if (!confirm("最后确认：所有数据将被删除！")) return;
  await maint("purge");
}

async function maint(action, arg) {
  try {
    const r = await apiPost("hdsi/maintenance", { action, arg });
    toast(r.message || "已完成"); refreshAll();
  } catch (e) { toast(e.message, true); }
}

async function importKoishi() {
  try {
    const raw = document.getElementById("koishi-json").value;
    const koishi = JSON.parse(raw);
    const r = await apiPost("hdsi/migrate_config", { koishi_config: koishi });
    toast(r.message || "导入成功"); CFG = null; renderCurrent();
  } catch (e) { toast(e.message, true); }
}

async function refreshAll() { CFG = null; renderCurrent(); }

// ---- boot & status update ----
async function updateBannerAndSteps() {
  try {
    const data = await apiGet("hdsi/overview");
    const dot = document.getElementById("status-dot");
    const label = document.getElementById("status-label");
    const detail = document.getElementById("status-detail");

    if (data?.story) {
      dot.className = "dot on";
      label.textContent = `✅ ${data.story.characterName} 的故事正在运行`;
      detail.textContent = `${data.story.status} | 参与者 ${data.story.participants} 人 | 游标 ${fmtTime(data.story.cursorAt)}`;
      document.getElementById("tag-init").textContent = "已完成";
      document.getElementById("tag-init").className = "status-tag ok";
      document.getElementById("step-init").classList.add("done");
      document.getElementById("step-init").querySelector(".num").textContent = "✓";
      if ((data.recentScript || []).some(e => e.kind === "character-message")) {
        document.getElementById("tag-chat").textContent = "进行中";
        document.getElementById("tag-chat").className = "status-tag ok";
        document.getElementById("step-chat").classList.add("done");
        document.getElementById("step-chat").querySelector(".num").textContent = "✓";
      }
      document.getElementById("steps").style.display = "none";
    } else {
      dot.className = "dot warn";
      label.textContent = "尚未开始";
      detail.textContent = "按下方步骤操作即可开始";
    }
  } catch (e) {
    document.getElementById("status-dot").className = "dot off";
    document.getElementById("status-label").textContent = "无法连接插件";
    document.getElementById("status-detail").textContent = e.message;
  }
}

(async function boot() {
  document.querySelectorAll(".tab")[0].classList.add("active");
  if (window.AstrBotPluginPage?.ready) { try { await window.AstrBotPluginPage.ready(); } catch {} }
  await updateBannerAndSteps();
  renderView("status");
})();
</script>
</body>
</html>
